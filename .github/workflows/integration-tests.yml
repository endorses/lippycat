name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: "1.27.2"
  LOG_LEVEL: "info"

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Generate test certificates
        run: |
          cd test/testcerts
          ./generate_test_certs.sh
          ls -la

      - name: Run integration tests
        run: |
          cd test
          go test -v -run TestIntegration -timeout 20m

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            test/*.log
            test/*.pcap
          retention-days: 7

  docker-integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate test certificates
        run: |
          cd test/testcerts
          ./generate_test_certs.sh

      - name: Build Docker images
        run: |
          cd test
          docker compose build

      - name: Start services
        run: |
          cd test
          docker compose up -d processor hunter1 hunter2

      - name: Wait for services to be healthy
        run: |
          cd test
          timeout 60 bash -c 'until docker compose ps processor | grep -q "healthy"; do sleep 2; done'
          echo "Processor is healthy"

      - name: Check service logs
        run: |
          cd test
          docker compose logs processor
          docker compose logs hunter1

      - name: Verify services are running
        run: |
          cd test
          docker compose ps
          docker compose exec -T processor lc process --help || true
          docker compose exec -T hunter1 lc hunt --help || true

      - name: Test TLS connectivity
        run: |
          cd test
          docker compose exec -T client openssl s_client -connect processor.test.local:55555 \
            -cert /certs/client-cert.pem \
            -key /certs/client-key.pem \
            -CAfile /certs/ca-cert.pem \
            </dev/null || true

      - name: Collect service logs
        if: always()
        run: |
          cd test
          docker compose logs > docker-integration-logs.txt

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-logs
          path: test/docker-integration-logs.txt
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          cd test
          docker compose down -v

  ebpf-admission:
    name: VoIP eBPF Kernel and Command Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run isolated privileged tests
        run: make test-ebpf
