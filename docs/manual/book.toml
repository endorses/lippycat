[book]
title = "lippycat 🫦🐱 Manual"
authors = ["lippycat contributors"]
description = "Comprehensive guide to network traffic capture and analysis with lippycat"
language = "en"
src = "src"

[build]
build-dir = "book"
extra-watch-dirs = ["po", "languages.json"]

[output.html]
git-repository-url = "https://github.com/endorses/lippycat"
edit-url-template = "https://github.com/endorses/lippycat/edit/main/docs/manual/{path}"
site-url = "https://lippy.cat/"
additional-js = [
    "mermaid.min.js",
    "mermaid-init.js",
    "theme/language-selector.js",
    "theme/sidebar.js",
    "theme/term-hints.js",
    "theme/external-links.js",
    "theme/image-viewer.js",
]
additional-css = [
    "theme/language-selector.css",
    "theme/term-hints.css",
    "theme/figures.css",
    "theme/comparison.css",
    "theme/external-links.css",
    "theme/image-viewer.css",
]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.gettext]
after = ["links"]
before = ["mermaid"]

[preprocessor.figures]
command = "python3 tools/figures.py"
renderers = ["html"]
after = ["gettext"]
before = ["mermaid"]
