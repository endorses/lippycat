name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: "1.27.2"
  LOG_LEVEL: "info"

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: all
            tags: all
          - configuration: all-li
            tags: all,li

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.29.0
        with:
          args: "-fmt sarif -out gosec-results-${{ matrix.configuration }}.sarif -no-fail -tags=${{ matrix.tags }} ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true # Don't fail build if SARIF format is invalid
        with:
          sarif_file: gosec-results-${{ matrix.configuration }}.sarif
          category: gosec-${{ matrix.configuration }}

      - name: Run govulncheck
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags="$BUILD_TAGS" ./...
